services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-portfolio}
      POSTGRES_USER: ${DATABASE_USERNAME:-portfolio}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-portfolio}
    ports:
      - "5432:5432"
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-portfolio} -d ${DATABASE_NAME:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  portfolio-api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-portfolio}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-portfolio}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-portfolio}
      SERVER_PORT: 8080
      AUTH0_ISSUER: ${AUTH0_ISSUER}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  portfolio_postgres_data:
