spring.application.name=portfolio-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${DATABASE_USERNAME:portfolio}
spring.datasource.password=${DATABASE_PASSWORD:portfolio}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

